<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" fill="none">
  <defs>
    <style>
      .cap { stroke:#F3E9D8; stroke-width:2; fill:none; }
      .tube { stroke:#F3E9D8; stroke-width:2; fill:none; }
      .detail { stroke:#E08A2E; stroke-width:1; fill:none; }
    </style>
  </defs>
  <!-- Cap -->
  <polygon class="cap" points="50,30 70,30 80,50 40,50"/>
  <line class="detail" x1="55" y1="30" x2="55" y2="20"/>
  <!-- Tube -->
  <rect class="tube" x="90" y="40" width="20" height="60"/>
  <line class="detail" x1="100" y1="40" x2="100" y2="30"/>
</svg>
