<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2EADE"/>
      <stop offset="1" stop-color="#E3D7C4"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF7EF"/>
      <stop offset="1" stop-color="#EFE6D6"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect width="800" height="1000" fill="url(#bg)"/>

  <!-- painel sugerindo retrato enquadrado -->
  <path d="M 200 760 C 200 470 250 300 400 300 C 550 300 600 470 600 760 Z"
        fill="url(#panel)" stroke="#C89A6B" stroke-opacity="0.5" stroke-width="2"/>

  <!-- traço de caneta (escrita) -->
  <path d="M 330 500 C 360 430 400 430 430 470 C 455 505 480 480 520 520"
        fill="none" stroke="#7A5738" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round"
        transform="translate(0 -40) scale(0.9)"/>

  <!-- monograma discreto -->
  <text x="400" y="635" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-style="italic"
        font-size="52" fill="#7A5738" fill-opacity="0.6">RG</text>

  <text x="400" y="700" text-anchor="middle"
        font-family="Georgia, serif" font-size="22" fill="#7D6A57" fill-opacity="0.9">
    Retrato do professor
  </text>
  <text x="400" y="732" text-anchor="middle"
        font-family="Georgia, serif" font-style="italic" font-size="18" fill="#9A896F">
    substitua aqui pela foto real
  </text>
</svg>